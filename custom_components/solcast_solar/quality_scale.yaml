rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      The requirements aiofiles and watchfiles are open source, published on PyPI and built in public CI.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: |
      Entity events are not used by this integration, so there is nothing to set up.
  entity-unique-id: done
  has-entity-name:
    status: exempt
    comment: |
      RooftopSensor uses the Solcast site name directly as the entity name.
      Changing this to use `has_entity_name` would rename existing entities and
      break user expectations around long-standing entity names.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: |
      Several entries are allowed. Each needs a name of its own (the unique ID of a new entry). Entries may share
      an API key, but a site is fetched by one entry only: a new key leaves the sites another entry fetches
      excluded, and the user, reconfigure, reauth and options flows and the set_options action refuse a site
      fetched elsewhere. A repair names the entries of a key whose API limits add up to more than ten.
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: |
      It is not desirable to log once when the Solcast REST API is unavailable and then once more when re-connected. Each interaction is atomic, and a connection is not held open.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      The whole suite covers every statement, the bodies of `try:` blocks included. tests/.coveragerc excludes
      only `pragma: no cover`, type-checking imports and fall-backs for older Core versions; CI requires 100 %
      on two Core versions.
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      Local devices are not used, so updating network information is irrelevant.
  discovery:
    status: exempt
    comment: |
      Local devices are not used, so discovery of any is irrelevant.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      Local devices are not used, and API variability is irrelevant.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      A single service device is created for each config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      A single service device is created for each config entry and removed with it.
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: exempt
    comment: |
      This project is maintained as a custom integration. Core mypy.ini strict
      sections are not a meaningful compliance signal for this integration.
      Strict typing is adhered to, and is expected for any new code contributions.
