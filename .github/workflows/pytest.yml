name: test_multi_instance
run-name: Each entry keeps its own cache files, sensors, device and service calls. A rooftop used twice is logged and not created twice.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-instance:
    name: Latest stable Home Assistant. Own files, sensors, device and calls per entry. A shared rooftop is only logged.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Resolve the latest stable Home Assistant release
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using Home Assistant $tag"

      - name: Checkout Home Assistant core
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ steps.core.outputs.tag }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: core/.python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Install Home Assistant test environment
        working-directory: core
        run: |
          uv pip install --system \
            -e . \
            -r requirements_all.txt \
            -r requirements_test.txt \
            "aiofiles>=23.2.0" \
            "watchfiles>=1.0.0" \
            colorlog \
            --config-settings editable_mode=compat

      - name: Mount the integration into core
        run: |
          rm -rf core/homeassistant/components/solcast_solar
          cp -a integration/custom_components/solcast_solar core/homeassistant/components/solcast_solar
          mkdir -p core/tests/components
          rm -rf core/tests/components/solcast_solar
          cp -a integration/tests core/tests/components/solcast_solar

      - name: Keep autospec from evaluating type-checking imports
        run: |
          python - << 'PY'
          import inspect
          from pathlib import Path
          target = Path(inspect.__file__).parent / "sitecustomize.py"
          target.write_text(
              "import annotationlib\n"
              "import inspect as _inspect\n"
              "\n"
              "_orig = annotationlib.get_annotations\n"
              "\n"
              "def _safe_annotations(*args, **kwargs):\n"
              "    try:\n"
              "        return _orig(*args, **kwargs)\n"
              "    except NameError:\n"
              "        return {}\n"
              "\n"
              "annotationlib.get_annotations = _safe_annotations\n"
              "_inspect.get_annotations = _safe_annotations\n"
          )
          PY

      - name: Compile translations
        working-directory: core
        run: python3 -m script.translations develop --all

      - name: Run the two-entry tests
        working-directory: core
        run: pytest tests/components/solcast_solar/test_multi_instance.py -vv --timeout=300
